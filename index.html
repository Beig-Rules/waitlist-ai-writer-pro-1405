<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نویسنده‌یار پرو | لیست انتظار</title>
  <style>
    :root { --bg: #0a0a0a; --fg: #f5f5f5; --accent: #ffffff; --muted: #888; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Vazirmatn', system-ui, sans-serif; background: var(--bg); color: var(--fg); line-height: 1.7; }
    .container { max-width: 720px; margin: 0 auto; padding: 4rem 1.5rem; text-align: center; }
    h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 1rem; }
    p.lead { font-size: 1.15rem; color: var(--muted); margin-bottom: 2rem; }
    form { display: flex; flex-direction: column; gap: 1rem; max-width: 400px; margin: 0 auto; }
    input { padding: 0.85rem 1rem; border: 1px solid #333; background: #111; color: #fff; border-radius: 4px; font-size: 1rem; }
    button { padding: 0.9rem; background: #fff; color: #000; border: none; font-weight: 600; cursor: pointer; border-radius: 4px; }
    button:hover { opacity: 0.9; }
    .note { margin-top: 1.5rem; font-size: 0.85rem; color: var(--muted); }
  </style>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h1>نویسنده‌یار پرو</h1>
    <p class="lead">ابزار نوشتار هوشمند مخصوص فارسی‌زبانان. به زودی راه‌اندازی می‌شود.</p>
    <form>
      <input type="email" placeholder="ایمیل شما" required>
      <button type="submit">عضو لیست انتظار شوید</button>
    </form>
    <p class="note">بدون اسپم. فقط اعلان راه‌اندازی.</p>
  </div>
</body>
</html>
